name: TBFTMac
options:
  bundleIdPrefix: info.marzan.tbft
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  TBFTMac:
    type: application
    platform: macOS
    sources:
      - path: TBFTMac
      - path: Shared
    info:
      path: TBFTMac/Info.plist
      properties:
        CFBundleDisplayName: TBFT
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        TBFT_SHARED_GROUP_ID: $(DEVELOPMENT_TEAM).info.marzan.tbft.shared
        CFBundleURLTypes:
          - CFBundleURLName: info.marzan.tbft.macos
            CFBundleURLSchemes:
              - tbftmac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.marzan.tbft.macos
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: TBFTMac/TBFTMac.entitlements
        REGISTER_APP_GROUPS: NO
    dependencies:
      - target: TBFTWidget
        embed: true

  TBFTWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: TBFTWidget
      - path: Shared
    info:
      path: TBFTWidget/Info.plist
      properties:
        CFBundleDisplayName: TBFT Today
        TBFT_SHARED_GROUP_ID: $(DEVELOPMENT_TEAM).info.marzan.tbft.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: info.marzan.tbft.macos.widget
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: TBFTWidget/TBFTWidget.entitlements
        REGISTER_APP_GROUPS: NO
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

schemes:
  TBFTMac:
    build:
      targets:
        TBFTMac: all
        TBFTWidget: all
    run:
      config: Debug
    archive:
      config: Release
